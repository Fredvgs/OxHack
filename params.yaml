# Every number the model uses lives in this file. Change anything here; no code edits needed.
# Units are in the names: _gbp = £, _ha = hectares, _hours, _pct = %, _mm = millimetres.

#Simulation
season_hours: 126       # how many hours we simulate, must fit in forecast_hours (126 = 21 replans)
plan_hours: 48           # how far ahead each plan looks (must be >= sensor_every_hours)
sensor_every_hours: 6    # a new moisture reading arrives this often, recall forecast and replan at this interval
truth_member: 0          # forecast member that plays "the weather that really happened"

#Farm
fields:   # lat/lon are only used to download a forecast.
  # Demo farm: each field borrows the weather of a different European place, picked from 21 so
  # the fields' rain and humidity differ as much as possible (fields near each other all get the
  # same weather). travel_hours below is still a compact farm; it ignores these coordinates.
  - {name: inverness_uk,  crop: wheat,  area_ha: 40, lat: 57.48, lon: -4.22}
  - {name: cork_ie,       crop: barley, area_ha: 35, lat: 51.90, lon: -8.47}
  - {name: valladolid_es, crop: wheat,  area_ha: 30, lat: 41.65, lon: -4.72}
  - {name: poznan_pl,     crop: barley, area_ha: 45, lat: 52.40, lon: 16.90}
  - {name: bergen_no,     crop: wheat,  area_ha: 25, lat: 60.39, lon: 5.32}
  - {name: cherkasy_ua,   crop: barley, area_ha: 30, lat: 49.40, lon: 32.00}

machines:  # start = "depot" or a field name
  - {name: combine_a, ha_per_hour: 3.0, start: depot}
  - {name: combine_b, ha_per_hour: 2.5, start: depot}
  - {name: combine_c, ha_per_hour: 2.0, start: depot}

# Driving time in hours. Rows and columns: the fields in the order above, then the depot last.
# The simulator rounds up to whole hours.
travel_hours:
  - [0.00, 0.50, 0.50, 0.50, 1.00, 0.75, 0.25]
  - [0.50, 0.00, 1.00, 1.00, 1.00, 1.00, 0.75]
  - [0.50, 1.00, 0.00, 0.50, 1.25, 1.00, 0.50]
  - [0.50, 1.00, 0.50, 0.00, 1.00, 0.50, 0.25]
  - [1.00, 1.00, 1.25, 1.00, 0.00, 0.50, 0.75]
  - [0.75, 1.00, 1.00, 0.50, 0.50, 0.00, 0.50]
  - [0.25, 0.75, 0.50, 0.25, 0.75, 0.50, 0.00]

#Crops
crops:
  wheat:  {price_gbp_per_t: 190, yield_t_per_ha: 8.5}
  barley: {price_gbp_per_t: 170, yield_t_per_ha: 7.0}

#Value function (harvest/value.py)
# TODO: remove once the moisture vs time graph gives each field's grain moisture at hour 0
temp_start_moisture_pct: 18          # placeholder, same for every field
# Drying: Camgrain charges, harvest 2026 (https://www.camgrain.co.uk/charges-for-2025)
target_moisture_pct: 14.0             # the store dries grain down to this
weight_loss_pct_per_pct: 1.25         # % of weight the store deducts per point of moisture removed
free_drying_up_to_pct: 15.0           # no drying charge at or below this
drying_band_pct: 0.5                  # the charge goes up in bands this wide...
drying_charge_gbp_per_band: 2.0       # ...by this much per tonne per band
max_harvest_moisture_pct: 25          # too wet to combine above this
min_moisture_pct: 12                  # grain never dries below this in the field
drying_pct_per_hour: 0.3              # drying per hour in bone-dry air (scaled by (100 - humidity) / 100)
rewetting_pct_per_mm: 0.5             # moisture gained per mm of rain
rain_limit_mm: 0.2                    # no harvesting in an hour with more rain than this
loss_pct_per_hour: 0.05               # crop value lost per hour it stays in the field

#Forecast download (only used by data/download_forecast.py)
forecast_start: "2026-10-25T00:00"    # UTC, first hour of data/forecast.csv
forecast_hours: 127                   # all the 9 km model gives from forecast_start (~144 h past its run)
forecast_model: ecmwf_ifs_europe_ensemble  # ECMWF IFS native 9 km ensemble, 51 members
