# Every number the model uses. Units are in the names: _gbp, _ha, _hours, _pct, _mm.

# Simulation (run.py, replay.py, compare.py)
plan_hours: 126              # how far ahead each plan looks, >= sensor_every_hours
sensor_every_hours: 6        # replan on each new moisture reading
forecast_every_hours: 6      # replan on each new forecast

# Live run (run.py)
season_hours: 126            # hours simulated, must fit in forecast_hours
truth_member: 0              # forecast member used as the real weather
forecast_start: "2026-10-25T00:00"         # UTC, first hour of data/forecast.csv
forecast_hours: 127
forecast_model: ecmwf_ifs_europe_ensemble  # ECMWF IFS 9 km, 51 members
past_weather_days: 21        # days of past weather before forecast_start

# Past rollouts (replay.py, compare.py). Dates on the command line override these.
rollout_start: "2026-10-10"
rollout_end: "2026-10-25"    # inclusive
past_forecast_dataset: ecmwf-ifs-ens-forecast-15-day-0-25-degree  # dynamical.org, 00 UTC runs
forecast_delay_hours: 8      # the 00 UTC run is published around 08 UTC
forecast_run_every_hours: 24
magnus_a: 17.625             # dew point to humidity (Alduchov & Eskridge 1996)
magnus_b_c: 243.04
past_weather_model: ecmwf_ifs  # Open-Meteo record of what actually happened

# Farm. Each field borrows a different European city's weather so they differ; lat/lon are
# only used for downloads and travel_hours is a made-up compact farm.
fields:
  - {name: inverness_uk,  crop: wheat,  area_ha: 40, lat: 57.48, lon: -4.22}
  - {name: cork_ie,       crop: barley, area_ha: 35, lat: 51.90, lon: -8.47}
  - {name: valladolid_es, crop: wheat,  area_ha: 30, lat: 41.65, lon: -4.72}
  - {name: poznan_pl,     crop: barley, area_ha: 45, lat: 52.40, lon: 16.90}
  - {name: bergen_no,     crop: wheat,  area_ha: 25, lat: 60.39, lon: 5.32}
  - {name: cherkasy_ua,   crop: barley, area_ha: 30, lat: 49.40, lon: 32.00}

machines:  # start: depot or a field name
  - {name: combine_a, ha_per_hour: 3.0, start: depot}
  - {name: combine_b, ha_per_hour: 2.5, start: depot}
  - {name: combine_c, ha_per_hour: 2.0, start: depot}

# Fields in the order above, then the depot. Rounded up to whole hours.
travel_hours:
  - [0.00, 0.50, 0.50, 0.50, 1.00, 0.75, 0.25]
  - [0.50, 0.00, 1.00, 1.00, 1.00, 1.00, 0.75]
  - [0.50, 1.00, 0.00, 0.50, 1.25, 1.00, 0.50]
  - [0.50, 1.00, 0.50, 0.00, 1.00, 0.50, 0.25]
  - [1.00, 1.00, 1.25, 1.00, 0.00, 0.50, 0.75]
  - [0.75, 1.00, 1.00, 0.50, 0.50, 0.00, 0.50]
  - [0.25, 0.75, 0.50, 0.25, 0.75, 0.50, 0.00]

crops:
  wheat:  {price_gbp_per_t: 190, yield_t_per_ha: 8.5}
  barley: {price_gbp_per_t: 170, yield_t_per_ha: 7.0}

# Value function (harvest/value.py). Drying charges from Camgrain, harvest 2026.
temp_start_moisture_pct: 18        # TODO: replace with the moisture model's hour 0
target_moisture_pct: 14.0
weight_loss_pct_per_pct: 1.25      # weight deducted per point dried
free_drying_up_to_pct: 15.0
drying_band_pct: 0.5
drying_charge_gbp_per_band: 2.0    # per tonne
max_harvest_moisture_pct: 25       # too wet to combine above this
min_moisture_pct: 12
drying_pct_per_hour: 0.3           # in dry air, scaled by (100 - humidity) / 100
rewetting_pct_per_mm: 0.5
rain_limit_mm: 0.2                 # no cutting in an hour wetter than this
loss_pct_per_hour: 0.05            # crop value lost per hour left standing

# Running costs (harvest/simulate.py): what every plan is scored with, per combine-hour.
#   cutting: diesel + operator + repairs     driving: diesel + operator + escort + repairs
#   waiting in a field: operator only        at the depot: nothing
running_costs:
  diesel_gbp_per_litre: 1.00           # red diesel ex VAT, UK average June 2026
  cutting_diesel_litres_per_ha: 15     # published figures run 11-20 l/ha
  road_diesel_litres_per_hour: 20      # ~12 mph at ~1 l/km (Masek et al. 2015)
  operator_gbp_per_hour: 19            # ~£15/h pay plus employer NI and holiday pay
  road_escort_gbp_per_hour: 25         # required over 3.5 m wide; pay plus their vehicle
  repairs_gbp_per_engine_hour: 31      # 23% of a £400k list price over 3,000 h (Calcante et al. 2013)

# Planner costs: rough numbers the planners steer by. Scoring uses running_costs.
idle_in_field_gbp_per_hour: 20
drive_gbp_per_hour: 10
depot_when_idle: true              # send idle combines home if cheaper (every planner but mpc)
depot_margin_gbp: 20               # only if it saves more than this

# plan_lagrangian
lagrangian_iterations: 300
lagrangian_first_step_gbp_per_ha: 50  # step k is this / k
lagrangian_wait_margin_gbp_per_ha: 5  # only wait for a later hour if it gains this much

# plan_mpc
mpc_scenarios: 50                  # forecast members each plan is scored in; 0 = mean only
mpc_rounds: 5                      # route re-plans per combine
mpc_route_passes: 3                # tries per re-plan
mpc_terminal_hours: 24             # grain left at the end is worth its mean value over these hours,
mpc_terminal_value_pct: 100        # times this

# Grain moisture model (harvest/moisture.py), writes outputs/moisture_forecast.csv.
# °C, RH as a fraction, moisture dry basis (kg/kg).
moisture_model:
  gas_constant_j_per_mol_k: 8.314
  kelvin_offset: 273.15
  rh_min: 0.05                     # Henderson blows up as RH -> 1
  rh_max: 0.95
  # A rain hour replaces drying with a capped rise (Smith, Bailey & Ingram 1981, eqns 6a, 6b):
  #   m = min(m + rain_rise_per_hour * rain_rise_scale, rain_max_mc)
  rain_rise_per_hour: 0.028
  rain_max_mc: 0.52                # ~34% wet basis
  rain_threshold_mm: 0.3           # our choice, not from the paper
  # EMC (modified Henderson) fitted to the PAMI charts; drying rate (Lewis, Arrhenius) from
  # Noroña et al. dryer tests at 40-60 °C. start_moisture_pct (% wet basis) are placeholders.
  crops:
    wheat:  {henderson_k: 2.2846e-5, henderson_c: 55.990,  henderson_n: 2.2876,
             k_ref_per_hour: 0.1255, t_ref_c: 40, ea_j_per_mol: 50630, start_moisture_pct: 10,
             rain_rise_scale: 1.0}
    barley: {henderson_k: 2.2451e-5, henderson_c: 197.489, henderson_n: 2.0160,
             k_ref_per_hour: 0.1653, t_ref_c: 40, ea_j_per_mol: 55890, start_moisture_pct: 10,
             rain_rise_scale: 1.0}
    # Oilseed rape: k_ref copied from wheat, rain response assumed the same as barley.
    osr:    {henderson_k: 5.0569e-4, henderson_c: 39.978,  henderson_n: 1.5714,
             k_ref_per_hour: 0.126,  t_ref_c: 40, ea_j_per_mol: 28470, start_moisture_pct: 8,
             rain_rise_scale: 1.0}

# Made-up weather for scripts/plot_moisture_demo.py and scripts/moisture_sensitivity.py
moisture_demo:
  days: 7
  mean_temp_c: 15
  temp_swing_c: 6                  # daily swing either side of the mean
  warmest_hour: 15                 # also the driest
  mean_rh: 0.75
  rh_swing: 0.18
  rain_spells: [[60, 3], [110, 6]] # [start hour, length]
  rain_mm_per_hour: 1.0
  ea_range_j_per_mol: [30000, 55000]
  ea_steps: 6
  k_ref_scales: [0.5, 1.5]

# Values tried by scripts/rain_sensitivity.py
rain_sensitivity:
  thresholds_mm: [0.0, 0.3, 0.5]
  osr_rain_rise_scales: [0, 0.75, 1.0]
