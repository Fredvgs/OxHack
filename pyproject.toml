[project]
name = "time-to-harvest"
version = "0.1.0"
description = "Time to Harvest: forecast -> value function -> planner -> replanning loop (OxHack26)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dynamical-catalog>=1.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "xarray>=2026.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
web = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
