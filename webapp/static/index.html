<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time to Harvest</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/home.js"></script>
</head>
<body>
  <main class="home">
    <div class="intro">
      <h1>Time to Harvest</h1>
      <p class="slogan">Cut every field at its best hour.</p>
      <a class="button" href="map.html">Log in</a>
    </div>

    <!-- b-roll: one clip at a time, changing every few seconds, each from data-start (in seconds,
         where the 8 s shown have machines only, no people). Credits: media/CREDITS.md -->
    <figure class="broll">
      <div class="reel" data-seconds="8">
        <video muted loop playsinline preload="auto" poster="media/harvest-fleet.jpg" data-start="3"
          data-caption="Two combines and a grain cart. Video: USDA, public domain">
          <source src="media/harvest-fleet.webm" type="video/webm"></video>
        <video muted loop playsinline preload="auto" poster="media/harvest-field.jpg" data-start="0.5"
          data-caption="A combine working down a wheat field. Video: USDA, public domain">
          <source src="media/harvest-field.webm" type="video/webm"></video>
        <video muted loop playsinline preload="auto" poster="media/harvest-dust.jpg" data-start="10.5"
          data-caption="Combines at work, dust behind them. Video: USDA, public domain">
          <source src="media/harvest-dust.webm" type="video/webm"></video>
      </div>
      <figcaption id="broll-caption"></figcaption>
    </figure>
  </main>
</body>
</html>
